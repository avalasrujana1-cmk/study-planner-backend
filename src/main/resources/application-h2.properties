# No-MySQL mode for quick testing. Run:
#   mvn spring-boot:run "-Dspring-boot.run.profiles=h2"
# Data is saved in the backend/data folder. Switch to the "local" profile to use MySQL.
spring.datasource.url=jdbc:h2:file:./data/studyplanner;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
